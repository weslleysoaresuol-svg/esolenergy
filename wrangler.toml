name = "esolenergy-pwa"
compatibility_date = "2026-07-30"
pages_build_output_dir = "./dist"

# Mapeamento Oficial de Domínios .com.br (Brasil):
# - esolenergy.com.br (Website Institucional / Apex Root)
# - www.esolenergy.com.br (Redirecionamento WWW)
# - app.esolenergy.com.br (Aplicativo do Consultor PWA Mobile)
# - admin.esolenergy.com.br (Portal Administrativo & Cockpits)
# - api.esolenergy.com.br (Developer Hub & Webhooks REST API)
# - ead.esolenergy.com.br (EAD Esol Academy)

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), microphone=(), camera=(self)"

[[headers]]
for = "/sw.js"
[headers.values]
Service-Worker-Allowed = "/"
Cache-Control = "no-cache"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
