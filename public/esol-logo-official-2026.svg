<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 136" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .esol-font-e {
        font-family: 'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 88px;
      }
      .esol-font-sol {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 88px;
        letter-spacing: -2px;
      }
      .esol-font-energy {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -1px;
      }
    </style>
  </defs>
  
  <g transform="translate(4, 0)">
    <!-- Letra 'e' (Verde Esmeralda #22C55E) -->
    <text x="8" y="82" fill="#22C55E" class="esol-font-e">e</text>
    
    <!-- Palavra 'SOL' (Amarelo Dourado Solar #F59E0B) -->
    <text x="68" y="82" fill="#F59E0B" class="esol-font-sol">SOL</text>
    
    <!-- Palavra 'energy' (Dark Navy #1E293B) -->
    <text x="134" y="122" fill="#1E293B" class="esol-font-energy">energy</text>
  </g>
</svg>