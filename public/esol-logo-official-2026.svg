<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 145" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-text-e { font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif; font-weight: 800; font-size: 92px; }
      .brand-text-sol { font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 92px; letter-spacing: -0.02em; }
      .brand-text-energy { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 42px; letter-spacing: -0.02em; }
    </style>
  </defs>
  <g class="esol-brand-vector">
    <!-- e (Verde Esmeralda) -->
    <text x="12" y="86" fill="#22C55E" class="brand-text-e">e</text>
    <!-- SOL (Amarelo Dourado Solar) -->
    <text x="74" y="86" fill="#F59E0B" class="brand-text-sol">SOL</text>
    <!-- energy (Dark Navy) -->
    <text x="144" y="128" fill="#1E293B" class="brand-text-energy">energy</text>
  </g>
</svg>