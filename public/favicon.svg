<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision">
  <style>
    .fav-light { display: block; }
    .fav-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .fav-light { display: none; }
      .fav-dark { display: block; }
    }
  </style>
  <g class="fav-light">
    <image href="/favicon.png" x="0" y="0" width="512" height="512" />
  </g>
  <g class="fav-dark">
    <image href="/favicon-dark.png" x="0" y="0" width="512" height="512" />
  </g>
</svg>