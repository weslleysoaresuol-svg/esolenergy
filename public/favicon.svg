<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision">
  <!-- Fundo Dark Slate Arredondado -->
  <rect width="512" height="512" rx="140" fill="#020617" stroke="#1E293B" stroke-width="8"/>

  <!-- Grupo 'so.' Unificado e Centralizado com Precisão Cirúrgica -->
  <g transform="translate(62, 136)">
    <!-- Letra 's' - Laço de Onda Fotônica em Vetor Branco Puro -->
    <path
      d="M 115 40 C 115 16 75 10 46 26 C 10 46 20 92 60 106 C 100 120 110 166 74 182 C 44 196 12 180 8 148"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letra 'o' - Círculo Vetorial Conectado em Harmonia com o 's' -->
    <circle
      cx="220"
      cy="110"
      r="66"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="26"
    />

    <!-- Ponto Verde Esmeralda Final '.' Alinhado no Canto Inferior Direito na Baseline -->
    <circle
      cx="332"
      cy="162"
      r="20"
      fill="#10B981"
    />
  </g>
</svg>