<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 170" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&amp;family=Outfit:wght@400;700&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #00246B;
        font-size: 82px;
        letter-spacing: -2px;
      }
      .brand-subtitle {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-style: italic;
        fill: #555555;
        font-size: 26px;
        letter-spacing: 12px;
      }
      .brand-slogan {
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        fill: #595959;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
    </style>
    <mask id="slash-mask">
      <rect x="-100" y="-100" width="200" height="200" fill="white" />
      <line x1="-50" y1="50" x2="50" y2="-50" stroke="black" stroke-width="8" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- ESOL LOGO LETTERS -->
  <g transform="translate(100, 10)">
    <!-- Letter E -->
    <text x="0" y="80" class="brand-title">E</text>
    <!-- Letter S -->
    <text x="60" y="80" class="brand-title">S</text>
    <!-- Letter O (Custom Sun-Slash Mark) -->
    <g transform="translate(152, 48) skewX(-12)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#FFB300" stroke-width="16" mask="url(#slash-mask)" />
    </g>
    <!-- Letter L -->
    <text x="192" y="80" class="brand-title">L</text>
  </g>

  <!-- ENERGY SUBTITLE -->
  <text x="231" y="125" text-anchor="middle" class="brand-subtitle">ENERGY</text>

  <!-- SLOGAN -->
  <text x="225" y="152" text-anchor="middle" class="brand-slogan">Deixe o sol trabalhar por você.</text>
</svg>