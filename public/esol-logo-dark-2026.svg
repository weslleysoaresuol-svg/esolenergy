<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-text-e {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 78px;
      }
      .brand-text-sol {
        font-family: 'Outfit', system-ui, sans-serif;
        font-weight: 900;
        font-size: 78px;
        letter-spacing: -2px;
      }
      .brand-text-energy {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.5px;
      }
    </style>

    <linearGradient id="quantumSolarGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>

    <linearGradient id="solarAmberGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>

  <g class="esol-international-master-brand">
    <!-- ÍCONE NÚCLEO QUANTUM SOLAR -->
    <g transform="translate(6, 12)">
      <circle cx="46" cy="48" r="40" fill="none" stroke="url(#quantumSolarGradDark)" stroke-width="6" stroke-dasharray="18 6" opacity="0.9" />
      <path d="M 46 16 L 56 36 L 76 48 L 56 60 L 46 80 L 36 60 L 16 48 L 36 36 Z" fill="url(#solarAmberGradDark)" />
      <path d="M 49 22 L 35 52 L 47 52 L 43 74 L 59 44 L 47 44 Z" fill="#FFFFFF" />
    </g>

    <!-- WORDMARK DE ALTA FIDELIDADE INTERNACIONAL -->
    <g transform="translate(112, 0)">
      <text x="0" y="74" fill="#10B981" class="brand-text-e">e</text>
      <text x="52" y="74" fill="#F59E0B" class="brand-text-sol">SOL</text>
      <text x="110" y="108" fill="#FFFFFF" class="brand-text-energy">energy</text>
      <circle cx="218" cy="98" r="5" fill="#06B6D4" />
    </g>
  </g>
</svg>