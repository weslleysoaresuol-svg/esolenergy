<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Escuro Oficial Maestro 2026 -->
  <rect width="512" height="512" rx="112" fill="#040814"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="url(#borderGlow)" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Efeito de Brilho Solar Ambiente -->
  <circle cx="256" cy="230" r="140" fill="url(#ambientGlow)" opacity="0.25"/>
  
  <!-- Logotipo Oficial eSOL energy -->
  <g transform="translate(256, 235)" text-anchor="middle">
    <!-- eSOL -->
    <text y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="96" letter-spacing="-2">
      <tspan fill="#10B981">e</tspan><tspan fill="#FFFFFF">SOL</tspan>
    </text>
    <!-- energy -->
    <text y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="44" letter-spacing="4" fill="#FBBF24">
      ENERGY
    </text>
  </g>

  <!-- Ponto de Energia Solar -->
  <circle cx="395" cy="180" r="10" fill="#10B981" filter="url(#glow)"/>

  <!-- Gradientes e Filtros -->
  <defs>
    <radialGradient id="ambientGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#040814" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="borderGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="glow" x="375" y="160" width="40" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
