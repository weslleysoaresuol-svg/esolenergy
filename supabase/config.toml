# A string used to distinguish different Supabase projects on the same host. Defaults to the working directory name when running `supabase init`.
project_id = "vgnyzrfvbpwzikcqrsdr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "https://esolenergy.com.br"
additional_redirect_urls = [
  "http://localhost:5173",
  "https://*.lovable.dev",
  "https://esolenergy.com",
  "https://admin.esolenergy.com.br"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://esolenergy.com.br/auth/callback"

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[storage]
enabled = true
file_size_limit = "50MiB"

# Registros de Edge Functions do CICLO 3
[functions.financeiro-webhook]
verify_jwt = false

[functions.ledger-engine]
verify_jwt = false

[functions.motor-dimensionamento-solar]
verify_jwt = false

[functions.motor-viabilidade-financeira]
verify_jwt = false

[functions.esol-sign-template]
verify_jwt = false

[functions.esol-sign-kyc]
verify_jwt = false

[functions.esol-sign-vault]
verify_jwt = false